<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prison of Calligraphy</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="game">
  <!-- 배경: 감옥 벽·창구·책상·묶인 손 한 장면 (assets/bg_cell.jpg) -->
  <div id="bg"></div>

  <header id="hud" class="hidden">
    <span><b data-i18n="stage">Stage</b> <span id="hudStage">1</span></span>
    <span><b data-i18n="time">Time</b> <span id="hudTime">30</span></span>
    <span><b data-i18n="quota">Accepted</b> <span id="hudQuota">0/4</span></span>
    <span><b data-i18n="lives">Lives</b> <span id="hudLives">♥♥♥</span></span>
    <span><img class="coin" src="assets/coin.png" alt=""> <span id="hudMoney">0</span> <b data-i18n="money">Nyang</b></span>
    <span><b data-i18n="pencil">Pencil</b> <span id="hudPencil"></span></span>
  </header>

  <main id="deskArea" class="hidden">
    <div id="desk">
      <div id="paperWrap"><canvas id="paper"></canvas></div><div id="scorePop"></div>
    </div>
    <div id="controls">
      <button id="btnSubmit" data-i18n="submit">Submit</button>
      <button id="btnNew" data-i18n="newSheet">New sheet</button>
    </div>
  </main>

  <!-- 다 쓴 종이 더미 (책상 옆) -->
  <div id="stack"></div>
  <!-- 상점: 게임 화면이면 언제든 열 수 있게 늘 떠 있음 -->
  <button id="btnShop" class="hidden" data-i18n="shop">Shop</button>
  <!-- 연필 커서 -->
  <div id="penCursor" class="hidden"></div>
  <!-- 연필이 부러지는 순간 -->
  <div id="snap" class="hidden"></div>
  <div id="toast"></div>

  <!-- 튜토리얼: 눈을 뜨는 눈꺼풀, 창구 너머 목소리의 대사 -->
  <div id="eyes" class="hidden"><div class="hole"></div></div>
  <div id="dlg" class="hidden">
    <div id="dlgWho"></div>
    <p id="dlgText"></p>
    <div id="dlgHint" data-i18n="tu_hint">▸ click</div>
  </div>

  <section id="title" class="overlay">
    <!-- 타이틀: 창구에서 날아온 종이에 제목이 획 순서대로 써짐 → 한자 → 버튼 -->
    <div id="titleWrap"><canvas id="titlePaper" role="img" aria-label="Prison of Calligraphy"></canvas></div>
    <p id="titleSub">獄: 敎筆</p>
    <div id="titleBtns">
      <button id="btnContinue" class="hidden" data-i18n="continue">Continue</button>
      <button id="btnStart" data-i18n="start">Start</button>
      <button id="btnSettings" data-i18n="settings">Settings</button>
    </div>
  </section>
  <div id="fadeBlack"></div>

  <section id="settings" class="overlay hidden">
    <h2 data-i18n="settings">Settings</h2>
    <label><span data-i18n="language">Language</span>
      <select id="selLang"><option value="en">English</option><option value="ko">한국어</option></select>
    </label>
    <button id="btnSettingsClose" data-i18n="close">Close</button>
  </section>

  <section id="shop" class="overlay hidden">
    <h2 data-i18n="shop">Shop</h2>
    <p class="sub"><span id="shopMoney"></span></p>
    <div id="shopTabs"><button data-tab="items" data-i18n="tabItems">Items</button><button data-tab="skills" data-i18n="tabSkills">Skills</button></div>
    <table id="shopTable"></table>
    <button id="btnShopClose" data-i18n="close">Close</button>
  </section>

  <!-- 죽음: 복면 → "당신은 죽었습니다." -->
  <div id="hood" class="hidden"></div>
  <section id="death" class="overlay hidden">
    <h1 id="deathTitle" data-i18n="youDied">Game Over</h1>
    <p id="deathSub" class="sub"></p>
    <button id="btnDeath" data-i18n="restart">Back to title</button>
  </section>

  <section id="result" class="overlay hidden">
    <h2 id="resultTitle"></h2>
    <p id="resultText"></p>
    <div id="resultScores"></div>
    <button id="btnResult"></button>
  </section>
</div>
<script src="src/i18n.js"></script>
<script src="src/glyphs.js"></script>
<script src="src/score.js"></script>
<script src="src/main.js"></script>
<script src="src/tutorial.js"></script>
</body>
</html>
